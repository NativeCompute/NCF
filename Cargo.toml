[workspace]
resolver = "2"
members = ["crates/ncf-tokens", "crates/ncf", "crates/ncf-build", "crates/ncf-cli", "examples/gallery"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.76"
license = "MIT"
authors = ["NativeCompute"]
homepage = "https://nativecompute.net"
repository = "https://github.com/NativeCompute/ncf"

[workspace.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[profile.dev.package.ncf]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
