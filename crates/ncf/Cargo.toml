[package]
name = "ncf"
description = "The NativeCompute Framework: NativeCompute's design language and app shell for egui apps."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
testing = []
cloud = ["dep:serde", "dep:keyring"]

[dependencies]
eframe = { workspace = true }
web-time = "1.1"
serde_json = "1"
png = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"
ureq = "2.10"
ring = "0.17"
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"], optional = true }
rfd = { version = "0.15", default-features = false }
eframe = { workspace = true, features = ["wgpu"] }
wgpu = { version = "22.1", default-features = false, features = ["metal"] }
