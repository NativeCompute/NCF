name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux — tests, clippy, tokens, browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: No comments in source
        run: tools/no-comments.sh
      - name: Tokens are current
        run: cargo run -q -p ncf-tokens -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: The desktop crate builds for the browser
        run: cargo build -p ncf --lib --target wasm32-unknown-unknown

  windows:
    name: Windows — tests and clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features

  template:
    name: A new app builds, tests and passes clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Make an app
        shell: bash
        run: cargo run -q -p ncf-cli -- new "Field Notes" --dir "$RUNNER_TEMP/field-notes" --ncf-path "$GITHUB_WORKSPACE"
      - name: Clippy
        working-directory: ${{ runner.temp }}/field-notes
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: ${{ runner.temp }}/field-notes
        run: cargo test

  shots:
    name: Gallery screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick x11-utils libgl1-mesa-dri libxkbcommon-x11-0
      - name: Take the screenshots
        run: tools/shots.sh "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-shots
          path: ${{ runner.temp }}/shots
